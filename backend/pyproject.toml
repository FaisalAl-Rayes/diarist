[project]
name = "diarist-backend"
version = "0.3.0"
description = "GPU-accelerated multi-speaker transcription API (Whisper + pyannote)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.0,<2",
  "pyannote-audio>=4.0,<5",
  "python-docx>=1.2,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12,<1",
]

[project.scripts]
diarist-api = "diarist.main:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diarist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".venv"]
